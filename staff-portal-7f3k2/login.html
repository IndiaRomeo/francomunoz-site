<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Acceso administrador | Franco Muñoz Law Firm</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
	:root {
		--blue: #004eab;
		--blue-dark: #003a80;
		--green: #01a54f;
		--ink: #16202b;
		--muted: #6b7686;
		--border: #e4e8ee;
		--bg: #f4f6f9;
	}
	* { box-sizing: border-box; }
	body {
		margin: 0;
		min-height: 100vh;
		display: flex;
		align-items: center;
		justify-content: center;
		background: linear-gradient(160deg, var(--bg) 0%, #e9edf4 100%);
		font-family: "Nunito Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
		padding: 24px;
	}
	.card {
		background: #fff;
		border-radius: 16px;
		padding: 40px 36px 32px;
		width: 100%;
		max-width: 380px;
		box-shadow: 0 20px 50px -12px rgba(0, 40, 90, 0.18), 0 2px 8px rgba(0, 40, 90, 0.06);
		border-top: 4px solid var(--blue);
	}
	.logo {
		display: block;
		height: 42px;
		margin: 0 auto 22px;
		object-fit: contain;
	}
	h1 {
		color: var(--ink);
		font-size: 20px;
		font-weight: 800;
		margin: 0 0 4px;
		text-align: center;
	}
	.subtitle {
		color: var(--muted);
		font-size: 13.5px;
		text-align: center;
		margin: 0 0 28px;
	}
	label {
		display: block;
		color: var(--ink);
		font-size: 13px;
		font-weight: 600;
		margin-bottom: 6px;
	}
	.field { margin-bottom: 18px; }
	input {
		width: 100%;
		padding: 11px 14px;
		border-radius: 9px;
		border: 1.5px solid var(--border);
		background: #fbfcfe;
		color: var(--ink);
		font-family: inherit;
		font-size: 14.5px;
		transition: border-color 0.15s ease, box-shadow 0.15s ease;
	}
	input:focus {
		outline: none;
		border-color: var(--blue);
		box-shadow: 0 0 0 3px rgba(0, 78, 171, 0.12);
	}
	button {
		width: 100%;
		padding: 12px;
		margin-top: 6px;
		border: none;
		border-radius: 9px;
		background: var(--blue);
		color: #fff;
		font-family: inherit;
		font-size: 15px;
		font-weight: 700;
		letter-spacing: 0.01em;
		cursor: pointer;
		transition: background 0.15s ease, transform 0.1s ease;
	}
	button:hover:not(:disabled) { background: var(--blue-dark); }
	button:active:not(:disabled) { transform: scale(0.99); }
	button:disabled { opacity: 0.6; cursor: default; }
	.error {
		display: flex;
		align-items: center;
		gap: 6px;
		background: #fdecec;
		color: #b3261e;
		border-radius: 8px;
		padding: 9px 12px;
		font-size: 13px;
		font-weight: 600;
		margin: -4px 0 16px;
		min-height: 0;
	}
	.error:empty { display: none; }
	.footnote {
		text-align: center;
		color: var(--muted);
		font-size: 12px;
		margin-top: 24px;
	}
</style>
</head>
<body>
<div class="card">
	<img class="logo" src="/wp-content/themes/Franco/images/site-logo.png" alt="Franco Muñoz Law Firm" />
	<h1>Acceso administrador</h1>
	<p class="subtitle">Panel privado de clientes registrados</p>
	<form id="login-form" autocomplete="off">
		<div class="field">
			<label for="email">Correo</label>
			<input type="email" id="email" required autocomplete="username" />
		</div>
		<div class="field">
			<label for="password">Contraseña</label>
			<input type="password" id="password" required autocomplete="current-password" />
		</div>
		<div class="error" id="error"></div>
		<button type="submit" id="submit-btn">Entrar</button>
	</form>
	<p class="footnote">Acceso restringido &middot; Franco Muñoz Law Firm</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/js/supabase-config.js"></script>
<script>
	var client = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_PUBLISHABLE_KEY);
	var form = document.getElementById("login-form");
	var errorEl = document.getElementById("error");
	var submitBtn = document.getElementById("submit-btn");

	client.auth.getSession().then(function (res) {
		if (res.data && res.data.session) {
			window.location.href = "dashboard.html";
		}
	});

	form.addEventListener("submit", function (e) {
		e.preventDefault();
		errorEl.textContent = "";
		submitBtn.disabled = true;
		submitBtn.textContent = "Entrando...";

		var email = document.getElementById("email").value.trim();
		var password = document.getElementById("password").value;

		client.auth.signInWithPassword({ email: email, password: password }).then(function (res) {
			submitBtn.disabled = false;
			submitBtn.textContent = "Entrar";
			if (res.error) {
				errorEl.textContent = "Correo o contraseña incorrectos.";
			} else {
				window.location.href = "dashboard.html";
			}
		});
	});
</script>
</body>
</html>
